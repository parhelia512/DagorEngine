# Read the Docs builds the Quirrel reference site from this directory. The path of
# this file is configured on the RTD project, so it has to stay where it is.
#
# The site is python3 and nothing else, so there is no requirements file and no
# sphinx section. build_rtd.sh owns the sequencing: a build.commands entry is its
# own shell, so a toolchain activated in one does not reach the next.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - bash prog/1stPartyLibs/quirrel/quirrel/doc/build_rtd.sh
